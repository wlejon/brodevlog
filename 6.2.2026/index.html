<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  /* Golden-hour sky behind the (transparent-above-horizon) scene layer: deep
     dusk blue up top grading to a warm gold band near the horizon. */
  body { background: linear-gradient(180deg,
    #16223f 0%, #243355 24%, #4a4a78 42%, #9c6f80 54%, #d98a55 64%, #f2b66e 74%, #f7d49a 100%); }
  #stage { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

  /* Bottom scrim → lifts caption contrast over busy footage. */
  #scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.18) 45%, rgba(0,0,0,0.62) 100%);
    pointer-events: none;
  }

  /* Kinetic caption overlay (captured by addViewportFrame over the scene). */
  #cap {
    position: absolute; left: 0; right: 0;
    bottom: 17%;
    text-align: center;
    padding: 0 6%;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 66px;
    color: #ffffff;
    text-transform: uppercase;
  }
  /* Per-word pills: each word on its own box, the spoken word on gold. The
     pill hugs the glyphs — line-height:1 so the box height tracks the text,
     vertical margin gives the gap between wrapped rows. */
  #cap .w {
    display: inline-block;
    line-height: 1.0;
    vertical-align: middle;
    margin: 7px 9px;
    /* bro clamps the line box to the font's full ascent+descent, so the caps
       already carry ~24px above / ~21px below at zero padding (measured). Use
       near-zero vertical padding, biased to balance those, so the pill hugs
       the caps as tight as the font allows. */
    padding: 0 18px 4px;
    border-radius: 12px;
    background: rgba(12,14,18,0.64);
    color: rgba(255,255,255,0.55);
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
  }
  #cap .w.on  { color: #ffffff; }
  #cap .w.hot { background: #ffd23e; color: #1a1410; }   /* the word being spoken */

  /* ---- "show the thing you're saying" overlays ----------------------------
     A floating code card (top third) whose contents scroll, plus a heightmap
     viz. Both are DOM, composited over the 3D scene by addViewportFrame — so
     the overlays are themselves the engine's HTML/CSS/JS on display. */
  #panel {
    position: absolute; left: 36px; right: 36px; top: 56px; height: 660px;
    background: rgba(13,15,21,0.76);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    opacity: 0;
    display: flex; flex-direction: column;
  }
  #panel .bar {
    display: flex; align-items: center; height: 56px; flex: none;
    padding: 0 22px; gap: 12px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-family: 'Consolas','Courier New',monospace;
  }
  #panel .dot { width: 14px; height: 14px; border-radius: 50%; }
  #panel .d1 { background: #ff5f57; } #panel .d2 { background: #febc2e; } #panel .d3 { background: #28c840; }
  #barfile { margin-left: 10px; color: #aeb7c6; font-size: 26px; }
  #barbadge {
    margin-left: auto; color: #1a1410; background: #7fd1a6;
    font-size: 24px; font-weight: 700; padding: 4px 14px; border-radius: 20px;
  }
  .codewrap { height: 604px; overflow: hidden; }
  #code {
    margin: 0; padding: 18px 26px;
    font-family: 'Consolas','Courier New',monospace;
    font-size: 27px; line-height: 36px; white-space: pre;
    color: #c8d2e0; will-change: transform;
  }
  #code .kw { color: #c792ea; }
  #code .st { color: #c3e88d; }
  #code .cm { color: #6b7689; font-style: italic; }
  #code .nu { color: #f78c6c; }
  #code .fn { color: #82aaff; }

  /* Heightmap viz card (terrain beat). */
  #viz {
    position: absolute; right: 48px; top: 760px; width: 300px;
    background: rgba(13,15,21,0.78);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px; padding: 14px; opacity: 0;
    box-shadow: 0 14px 50px rgba(0,0,0,0.5);
  }
  #hmap { width: 272px; height: 272px; display: block; border-radius: 8px; }
  #vizlabel {
    margin-top: 10px; text-align: center;
    font-family: 'Consolas','Courier New',monospace;
    font-size: 22px; color: #aeb7c6;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="scrim"></div>
  <div id="panel">
    <div class="bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      <span id="barfile">world.js</span><span id="barbadge"></span></div>
    <div class="codewrap"><pre id="code"></pre></div>
  </div>
  <div id="viz"><canvas id="hmap" width="272" height="272"></canvas><div id="vizlabel"></div></div>
  <div id="cap"></div>
  <script src="world.js"></script>
</body>
</html>
