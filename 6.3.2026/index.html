<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  /* Deep architectural blue-black behind the (transparent) scene layer, so the
     emissive flood wavefront and the gold solution read as neon against dark. */
  body { background: radial-gradient(120% 80% at 50% 8%,
    #111a33 0%, #0a1124 34%, #060a16 64%, #03050c 100%); }
  #stage { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

  /* Bottom scrim → lifts caption contrast over busy footage. */
  #scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.16) 45%, rgba(2,4,10,0.66) 100%);
    pointer-events: none;
  }

  /* Kinetic caption overlay (captured by addViewportFrame over the scene). */
  #cap {
    position: absolute; left: 0; right: 0;
    bottom: 16%;
    text-align: center;
    padding: 0 6%;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 66px;
    color: #ffffff;
    text-transform: uppercase;
  }
  /* Per-word pills: each word its own box; the spoken word on cyan. */
  #cap .w {
    display: inline-block;
    line-height: 1.0;
    vertical-align: middle;
    margin: 7px 9px;
    padding: 0 18px 4px;
    border-radius: 12px;
    background: rgba(10,14,22,0.66);
    color: rgba(255,255,255,0.52);
    text-shadow: 0 2px 5px rgba(0,0,0,0.85);
  }
  #cap .w.on  { color: #ffffff; }
  #cap .w.hot { background: #34e3ff; color: #04141a; }   /* the word being spoken */

  /* ---- "show the thing you're saying" overlays --------------------------- */
  #panel {
    position: absolute; left: 36px; right: 36px; top: 52px; height: 648px;
    background: rgba(9,12,20,0.80);
    border: 1px solid rgba(120,180,255,0.12);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    opacity: 0;
    display: flex; flex-direction: column;
  }
  #panel .bar {
    display: flex; align-items: center; height: 56px; flex: none;
    padding: 0 22px; gap: 12px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(120,180,255,0.10);
    font-family: 'Consolas','Courier New',monospace;
  }
  #panel .dot { width: 14px; height: 14px; border-radius: 50%; }
  #panel .d1 { background: #ff5f57; } #panel .d2 { background: #febc2e; } #panel .d3 { background: #28c840; }
  #barfile { margin-left: 10px; color: #9fb3d6; font-size: 26px; }
  #barbadge {
    margin-left: auto; color: #04141a; background: #34e3ff;
    font-size: 24px; font-weight: 700; padding: 4px 14px; border-radius: 20px;
  }
  .codewrap { height: 592px; overflow: hidden; }
  #code {
    margin: 0; padding: 18px 26px;
    font-family: 'Consolas','Courier New',monospace;
    font-size: 27px; line-height: 36px; white-space: pre;
    color: #c4d2ea; will-change: transform;
  }
  #code .kw { color: #c792ea; }
  #code .st { color: #c3e88d; }
  #code .cm { color: #5d6b86; font-style: italic; }
  #code .nu { color: #f78c6c; }
  #code .fn { color: #82aaff; }

  /* Live min-map of the algorithm (top-down), drawn with Canvas 2D. */
  #viz {
    position: absolute; right: 48px; top: 742px; width: 300px;
    background: rgba(9,12,20,0.82);
    border: 1px solid rgba(120,180,255,0.12);
    border-radius: 16px; padding: 14px; opacity: 0;
    box-shadow: 0 14px 50px rgba(0,0,0,0.55);
  }
  #mmap { width: 272px; height: 272px; display: block; border-radius: 8px; background: #05080f; }
  #vizlabel {
    margin-top: 10px; text-align: center;
    font-family: 'Consolas','Courier New',monospace;
    font-size: 22px; color: #9fb3d6;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="scrim"></div>
  <div id="panel">
    <div class="bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      <span id="barfile">maze.js</span><span id="barbadge"></span></div>
    <div class="codewrap"><pre id="code"></pre></div>
  </div>
  <div id="viz"><canvas id="mmap" width="272" height="272"></canvas><div id="vizlabel"></div></div>
  <div id="cap"></div>
  <script src="maze.js"></script>
</body>
</html>
